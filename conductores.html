<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff3b1f">
<meta name="description" content="Ringcon Go · Panel de conductores. Recibí pedidos y ganá con cada envío.">
<title>Ringcon Go · Conductores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--ink:#0f0f11;--mute:#71717a;--line:#f4f4f5;--soft:#fafafa;
  --brand:#ff3b1f;--brand-d:#e32d12;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;
  --r:24px;--display:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
h1,h2,h3,.logo,.money,.earn .big{font-family:var(--display);letter-spacing:-.03em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.logo{font-weight:800;font-size:22px;line-height:1}
.logo b{background:var(--brand);color:#fff;border-radius:10px;padding:2px 8px 4px;margin-left:4px;display:inline-block;transform:rotate(-4deg)}
.logo em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-left:10px}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#fff5f3 0%,#fff 70%)}
.login-box{max-width:380px;width:100%;text-align:center}
.login-box .ico{width:80px;height:80px;display:block;margin:0 auto 24px}
.login-box h1{font-size:32px;margin-bottom:8px}
.sub{color:var(--mute);margin-bottom:28px}
.field{display:block;margin-bottom:16px;font-size:13px;font-weight:600;color:var(--mute);text-align:left}
.field i{font-weight:400;font-style:normal}
.field input{display:block;width:100%;margin-top:6px;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--soft);font-size:16px;outline:0;transition:all .2s}
.field input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(255,59,31,.1)}
.veh{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 22px}
.veh button{padding:14px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--soft);font-weight:800;font-size:13px;transition:all .2s}
.veh button span{display:block;font-size:24px;margin-bottom:2px}
.veh button.on{border-color:var(--brand);background:#fff;box-shadow:0 8px 18px -8px rgba(255,59,31,.35)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.top-in{max-width:700px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hi{margin-top:4px;color:var(--mute);font-size:13px;font-weight:600}
.hi b{color:var(--ink)}
.top-r{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:none}

/* layout */
.wrap{max-width:700px;margin:0 auto;padding:24px 20px 140px}
.foot{color:var(--mute);font-size:12px;text-align:center;padding:24px 0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;justify-content:center;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:260px;padding:12px;border-radius:14px;font-weight:800;font-size:15px;color:var(--mute);transition:all .2s}
.tabs button.on{background:var(--ink);color:#fff}
.bdg{background:var(--brand);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px;margin-left:6px;vertical-align:2px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px;border-radius:16px;font-weight:800;width:100%;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 10px 25px -10px var(--brand)}
.btn.white{background:var(--ink);color:#fff;box-shadow:0 10px 25px -10px rgba(15,15,17,.4)}
.btn.big{padding:18px;font-size:16px}
.big{width:100%}

/* estado */
.status{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-radius:var(--r);background:var(--soft);border:1px solid var(--line);margin-bottom:20px}
.status small{color:var(--mute);font-size:12px;font-weight:700}
.status b{display:block;font-size:18px}
.switch{width:56px;height:32px;background:var(--line);border-radius:99px;position:relative;transition:background .2s;flex:none;display:block}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.switch.on{background:var(--ok)}
.switch.on i{transform:translateX(24px)}

/* radar / vacío */
.radar{text-align:center;padding:60px 0;color:var(--mute)}
.off-ic{font-size:56px;margin-bottom:10px}
.radar h2{font-size:22px;color:var(--ink);margin-bottom:6px}
.radar p{max-width:32ch;margin:0 auto}
.r{width:64px;height:64px;border-radius:50%;background:var(--ok);position:relative;margin:0 auto 14px;display:block;opacity:0}
.r::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:ping 1.6s infinite}
@keyframes ping{0%{transform:scale(1);opacity:1}to{transform:scale(3.2);opacity:0}}
.sec{font-size:20px;margin:20px 2px 14px}

/* tarjetas de pedidos */
.ocard{background:var(--soft);border:1.5px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px;transition:all .3s}
.ocard.fresh{background:#fff;border-color:var(--brand);box-shadow:0 20px 40px -15px rgba(255,59,31,.18);animation:fresh .9s ease}
@keyframes fresh{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.o-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--mute);font-weight:600}
.tag{background:#ffe8e3;color:var(--brand);font-weight:800;font-size:12px;padding:6px 12px;border-radius:99px}
.money{font-size:34px;font-weight:800;color:var(--ok);margin:10px 0 2px}
.money small{display:block;font-size:12px;color:var(--mute);font-family:system-ui;letter-spacing:0}
.route{margin:14px 0}
.stop{display:block}
.stop small{display:block;color:var(--mute);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stop b{display:block;font-size:15px;margin:2px 0 10px}
.stop.b b{font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cp{padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}

/* pedido activo */
.active{background:var(--soft);border:1.5px solid var(--brand);border-radius:var(--r);padding:24px;box-shadow:0 20px 40px -15px rgba(255,59,31,.15)}
.seg{display:flex;gap:8px;margin-bottom:18px}
.seg i{height:6px;flex:1;border-radius:99px;background:#fff;border:1px solid var(--line)}
.seg i.on{background:var(--brand);border-color:var(--brand)}
.active h2{font-size:26px}
.paid{background:#dcfce7;color:#166534;padding:14px 16px;border-radius:16px;font-weight:700;font-size:14px;margin:14px 0}
.cash{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:16px;border-radius:16px;margin:14px 0}
.cash small{display:block;font-weight:700}
.cash b{display:block;font-size:26px;font-family:var(--display);margin:2px 0}
.note{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14px}
.note small{display:block;color:var(--warn);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.items{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.items span{padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.acts a{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:800;color:var(--brand);text-decoration:none;font-size:14px}

/* ganancias */
.earn{background:linear-gradient(135deg,var(--brand) 0%,#ff7a45 100%);color:#fff;padding:26px;border-radius:var(--r);margin-bottom:22px;box-shadow:0 15px 30px -10px rgba(255,59,31,.4)}
.earn small{opacity:.9;font-weight:700}
.earn .big{font-size:44px;font-weight:800;line-height:1.1;margin:4px 0 14px}
.earn .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.earn .two small{display:block;opacity:.85}
.earn .two b{font-size:18px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line)}
.hist small{display:block;color:var(--mute);font-size:12px}
.hist .m{color:var(--ok);white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:30px 0}

#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);z-index:90;background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;transition:transform .3s;max-width:92vw;box-shadow:0 20px 40px rgba(0,0,0,.2)}
#toast.on{transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
</style>
</head>
